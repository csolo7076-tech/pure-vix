<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    background:#f8fcfc;
}





nav{
    width:100%;
    padding:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
}

nav ul{
    display:flex;
    justify-content:center;
    gap:35px;
    list-style:none;
}

nav li{
    width:110px;
    height:18px;
    background:#d8e6e8;
    border-radius:20px;
}





header{
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    #5d858d;

    text-align:center;
    padding:20px;
}

.titulo{
    width:520px;
    height:110px;

    background:#e9eef0;

    margin:auto;
    margin-top:220px;

    border-radius:20px;
}

.texto{
    width:650px;
    height:28px;

    background:#c9d3d6;

    margin:auto;
    margin-top:35px;

    border-radius:20px;
}





.productos{
    padding:100px 8%;
}

.subtitulo{
    width:340px;
    height:55px;

    background:#8ec9d1;

    margin:auto;
    margin-bottom:70px;

    border-radius:20px;
}

table{
    width:100%;
}

td{
    padding:20px;
}

article{
    background:white;

    border-radius:25px;

    overflow:hidden;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);

    height:520px;
}





.imagen{
    width:100%;
    height:320px;

    background:#b9dce0;
}





.linea1{
    width:70%;
    height:28px;

    background:#7faeb7;

    margin:auto;
    margin-top:25px;

    border-radius:20px;
}

.linea2{
    width:85%;
    height:18px;

    background:#d4dde0;

    margin:auto;
    margin-top:18px;

    border-radius:20px;
}

.linea3{
    width:40%;
    height:28px;

    background:#64b6c2;

    margin:auto;
    margin-top:22px;

    border-radius:20px;
}



.boton{
    width:150px;
    height:48px;

    background:
    linear-gradient(45deg,#7fd1da,#5fb7c2);

    margin:auto;
    margin-top:25px;

    border-radius:40px;
}





footer{
    background:#102028;
    padding:70px 10%;
}

footer table{
    width:100%;
}

.cuadro1{
    width:220px;
    height:30px;

    background:#8ce0e9;

    border-radius:20px;

    margin-bottom:25px;
}

.cuadro2{
    width:360px;
    height:18px;

    background:#5f7278;

    border-radius:20px;

    margin-bottom:15px;
}





@media(max-width:768px){

    nav ul{
        gap:15px;
        flex-wrap:wrap;
    }

    .titulo{
        width:300px;
        height:70px;
    }

    .texto{
        width:280px;
    }

}

</style>
</head>

<body>

<header>

<nav>

<ul>

<li></li>
<li></li>
<li></li>
<li></li>
<li></li>

</ul>

</nav>

<section class="titulo"></section>

<section class="texto"></section>

</header>



<section class="productos">

<section class="subtitulo"></section>

<table>

<tr>

<td>

<article>

<section class="imagen"></section>

<section class="linea1"></section>

<section class="linea2"></section>

<section class="linea3"></section>

<section class="boton"></section>

</article>

</td>



<td>

<article>

<section class="imagen"></section>

<section class="linea1"></section>

<section class="linea2"></section>

<section class="linea3"></section>

<section class="boton"></section>

</article>

</td>



<td>

<article>

<section class="imagen"></section>

<section class="linea1"></section>

<section class="linea2"></section>

<section class="linea3"></section>

<section class="boton"></section>

</article>

</td>

</tr>

</table>

</section>



<footer>

<table>

<tr>

<td>

<section class="cuadro1"></section>

<section class="cuadro2"></section>

<section class="cuadro2"></section>

</td>

<td>

<section class="cuadro1"></section>

<section class="cuadro2"></section>

<section class="cuadro2"></section>

</td>

</tr>

</table>

</footer>

</body>
</html>
