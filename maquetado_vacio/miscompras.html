<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#cceed2;
}




.menu{
    width:230px;
    height:100vh;

    background:#93cca4;

    float:left;

    padding-top:40px;
}

.logo{
    width:170px;
    height:35px;

    background:#84AB79;

    margin:auto;
    margin-bottom:40px;

    border-radius:20px;
}

.menu ul{
    list-style:none;
}

.menu li{
    width:130px;
    height:20px;

    background:#84AB79;

    margin-left:30px;
    margin-bottom:30px;

    border-radius:20px;
}




.contenido{
    margin-left:230px;
    padding:40px;
}





.titulo1{
    width:280px;
    height:55px;

    background:#639058;

    border-radius:20px;

    margin-bottom:20px;
}

.titulo2{
    width:420px;
    height:18px;

    background:#639058;

    border-radius:20px;

    margin-bottom:40px;
}





.caja{
    background:white;

    padding:30px;

    border-radius:25px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);
}





.comprita{
    background:#cceed2;

    border-radius:20px;

    padding:15px;

    margin-top:20px;
}





.imagen{
    width:90px;
    height:90px;

    background:#cceed2;

    border-radius:15px;

    display:inline-block;

    vertical-align:top;
}





.texto{
    display:inline-block;

    margin-left:20px;
    margin-top:5px;
}

.linea1{
    width:220px;
    height:25px;

    background:#639058;

    border-radius:20px;

    margin-bottom:15px;
}

.linea2{
    width:260px;
    height:15px;

    background:#639058;

    border-radius:20px;

    margin-bottom:15px;
}

.precio{
    width:90px;
    height:30px;

    background:#639058;

    border-radius:20px;
}

</style>
</head>

<body>



<section class="menu">

<section class="logo"></section>

<ul>

<li></li>

</ul>

</section>



<section class="contenido">

<section class="titulo1"></section>

<section class="titulo2"></section>



<section class="caja">



<section class="comprita">

</section>
