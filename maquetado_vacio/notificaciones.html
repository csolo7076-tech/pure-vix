<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;

    background:#6f7d7d;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;
}





.caja{

    width:400px;

    background:#d8c7bb;

    padding:40px;

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.2);
}





.titulo{
    width:220px;
    height:45px;

    background:#ffffff;

    border-radius:20px;

    margin:auto;
    margin-bottom:25px;
}



/* TEXTO */

.texto{
    width:260px;
    height:20px;

    background:#f3ece7;

    border-radius:20px;

    margin:auto;
    margin-bottom:35px;
}



/* BOTON */

.boton{
    width:140px;
    height:45px;

    background:#b88f76;

    border-radius:30px;

    margin:auto;
}

</style>
</head>

<body>

<section class="caja">

<section class="titulo"></section>

<section class="texto"></section>

<section class="boton"></section>

</section>

</body>
</html>
