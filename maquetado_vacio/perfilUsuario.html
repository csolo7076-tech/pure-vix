<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <style>

        body{
            font-family: Arial;
            background-color: #eef5ee;
            margin: 0;
        }

        header{
            background-color: #a8c3a0;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .contenedor{
            width: 400px;
            background-color: white;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            color: #7da37a;
            margin-bottom: 25px;
        }

        label{
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .boton{
            width: 100%;
            background-color: #8fb38a;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .boton:hover{
            background-color: #7da37a;
        }

    </style>

</head>
<body>

    <header>
        <h1></h1>
        <p></p>
    </header>

    <div class="contenedor">

        <h2></h2>

        <form>

            <label></label>
            <input type="text">

            <label></label>
            <input type="text">

            <label></label>
            <input type="text">

            <label></label>
            <input type="email">

            <label></label>
            <input type="tel">

            <label></label>
            <input type="text">

            <label></label>
            <input type="password">

            <button class="boton"></button>

        </form>

    </div>

</body>
</html>
