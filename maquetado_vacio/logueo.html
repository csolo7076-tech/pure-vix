<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#9dc4cc;
}



/* CUADRO */

.container{
    width:350px;

    background:#f8fdff;

    padding:40px;

    border-radius:25px;

    box-shadow:
    0 10px 30px rgba(120,170,190,0.25);
}



/* TITULO */

.titulo{
    width:180px;
    height:35px;

    background:#7fb9c5;

    margin:auto;
    margin-bottom:30px;

    border-radius:20px;
}



/* INPUTS */

.input{
    width:100%;
    height:50px;

    background:#eaf7fc;

    border-radius:12px;

    margin-bottom:20px;
}



/* BOTON */

.boton{
    width:100%;
    height:50px;

    background:#8ccfd9;

    border-radius:12px;

    margin-top:10px;
}



/* MENSAJE */

.mensaje{
    width:180px;
    height:18px;

    background:#c8dde4;

    margin:auto;
    margin-top:25px;

    border-radius:20px;
}

</style>
</head>

<body>

<section class="container">

<section class="titulo"></section>

<section class="input"></section>

<section class="input"></section>

<section class="boton"></section>

<section class="mensaje"></section>

</section>

</body>
</html>
