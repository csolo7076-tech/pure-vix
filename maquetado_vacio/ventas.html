<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    background:#f8f4f1;
}



.menu{
    width:230px;
    height:100vh;
    background:#c9a58b;
    padding-top:40px;
    float:left;
}

.logo{
    width:140px;
    height:35px;
    background:#f3e4d7;
    border-radius:12px;
    margin:auto;
    margin-bottom:40px;
}

.menu ul{
    list-style:none;
}

.menu li{
    padding:18px 30px;
}

.menu-opcion{
    height:18px;
    background:#e9d6c6;
    border-radius:10px;
}



.contenido{
    margin-left:230px;
    padding:40px;
}



.titulo{
    margin-bottom:40px;
}

.titulo-grande{
    width:340px;
    height:55px;
    background:#c59b7f;
    border-radius:18px;
    margin-bottom:15px;
}

.titulo-texto{
    width:420px;
    height:18px;
    background:#d8b8a0;
    border-radius:10px;
}



.tarjetas{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:30px;

    margin-bottom:50px;
}

.tarjeta{
    background:white;
    padding:35px;
    border-radius:25px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);
}

.numero{
    width:90px;
    height:45px;
    background:#c9a58b;
    border-radius:14px;
    margin-bottom:15px;
}

.texto{
    width:160px;
    height:18px;
    background:#ead8c9;
    border-radius:10px;
}



.tabla{
    background:white;

    padding:30px;

    border-radius:25px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);
}

.tabla-titulo{
    width:260px;
    height:40px;
    background:#b08463;
    border-radius:14px;
    margin-bottom:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#d8b8a0;
    padding:18px;
}

td{
    padding:18px;
    border-bottom:1px solid #eee;
}

.barra{
    height:18px;
    background:#e7d6c9;
    border-radius:10px;
    margin:auto;
}

.boton{
    width:110px;
    height:35px;
    background:#c9a58b;
    border-radius:30px;
    margin:auto;
}

@media(max-width:768px){

    .menu{
        width:100%;
        height:auto;
    }

    .contenido{
        margin-left:0;
    }

    .titulo-grande{
        width:240px;
    }

    .titulo-texto{
        width:260px;
    }

}

</style>
</head>

<body>

<div class="menu">

    <div class="logo"></div>

    <ul>

        <li><div class="menu-opcion"></div></li>

        <li><div class="menu-opcion"></div></li>

        <li><div class="menu-opcion"></div></li>

    </ul>

</div>

<div class="contenido">

    <div class="titulo">

        <div class="titulo-grande"></div>

        <div class="titulo-texto"></div>

    </div>

    <div class="tarjetas">

        <div class="tarjeta">

            <div class="numero"></div>

            <div class="texto"></div>

        </div>

        <div class="tarjeta">

            <div class="numero"></div>

            <div class="texto"></div>

        </div>

        <div class="tarjeta">

            <div class="numero"></div>

            <div class="texto"></div>

        </div>

    </div>

    <div class="tabla">

        <div class="tabla-titulo"></div>

        <table>

            <tr>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
            </tr>

            <tr>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="boton"></div></td>
            </tr>

            <tr>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="boton"></div></td>
            </tr>

            <tr>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="barra"></div></td>
                <td><div class="boton"></div></td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
