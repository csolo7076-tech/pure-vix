<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background-image: url("crema.avif");
        background-repeat: no-repeat;
        background-size: cover;
    }

    .container{
        width:350px;
        background:#f8fdff;
        padding:40px;
        border-radius:25px;
        box-shadow:0 10px 30px rgba(120, 170, 190, 0.25);
       
    }

    h2{
        text-align:center;
        color:#5d8ea3;
        margin-bottom:25px;
        font-weight:600;
    }

    .gmail{
        margin-bottom:20px;
    }

    .gmail input{
        width:100%;
        padding:14px;
        border:none;
        border-radius:12px;
        background:#eaf7fc;
        outline:none;
        font-size:15px;
        color:#4f6f7a;
        transition:0.3s;
    }

    .gmail input:focus{
        background:#dff3fa;
        box-shadow:0 0 8px rgba(120, 190, 220, 0.4);
    }

    .boton{
        width:100%;
        padding:14px;
        border:none;
        border-radius:12px;
        background:#8ccfd9;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
        font-weight:bold;
    }

    .boton:hover{
        background:#72bcc7;
       
    }

    .mensaje{
        text-align:center;
        margin-top:18px;
        color:#6f9cab;
        cursor:pointer;
        transition:0.3s;
    }

    .mensaje:hover{
        color:#4e7f90;
        text-decoration:underline;
    }

    .hidden{
        display:none;
    }
</style>
</head>

<body>

<div class="container">

   
    <div id="loginForm">
        <h2>Bienvenido</h2>

        <div class="gmail">
            <input type="email" placeholder="Correo electrónico">
        </div>

        <div class="gmail">
            <input type="password" placeholder="Contraseña">
        </div>

        <button class="boton">Entrar</button>

        <p class="mensaje" onclick="mostrarRegistro()">
            ¿No tienes cuenta? Registrarse
        </p>
    </div>

   
    <div id="registerForm" class="hidden">
        <h2>Crear Cuenta</h2>

        <div class="gmail">
            <input type="text" placeholder="Nombre completo">
        </div>

        <div class="gmail">
            <input type="email" placeholder="Correo electrónico">
        </div>

        <div class="gmail">
            <input type="password" placeholder="Contraseña">
        </div>

        <button class="boton">Registrarse</button>

        <p class="mensaje" onclick="mostrarLogin()">
            Ya tengo cuenta
        </p>
    </div>

</div>








<script>
    function mostrarRegistro(){
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("registerForm").classList.remove("hidden");
    }

    function mostrarLogin(){
        document.getElementById("registerForm").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");
    }
</script>

</body>
</html>
